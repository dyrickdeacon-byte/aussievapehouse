# Netlify deployment config.
# Netlify's free tier allows commercial use and includes 100GB/month of
# bandwidth (Vercel Hobby is non-commercial with 10GB), which is why this
# store runs here rather than on Vercel.

[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
  # These are public by design and appear in the site itself — the contact
  # address in the footer, the sender shown on emails, the CDN base URL — so
  # the scanner would flag them forever. Real secrets (SMTP_PASS,
  # SUPABASE_SERVICE_ROLE_KEY, ADMIN_PASSWORD, RESEND_API_KEY) stay scanned.
  SECRETS_SCAN_OMIT_KEYS = "MAIL_FROM,MAIL_OWNER,MAIL_REPLY_TO,SMTP_USER,SMTP_HOST,SUPABASE_URL,NEXT_PUBLIC_IMAGE_CDN"
  # the catalog is committed prebuilt, so CI only runs `next build`

# Official Next.js runtime — handles SSR routes, server actions and
# API routes as Netlify Functions.
[[plugins]]
  package = "@netlify/plugin-nextjs"

# Product imagery is content-addressed by slug and never mutated in place,
# so it can be cached hard. Without this the CDN revalidates constantly and
# every visitor re-downloads ~100MB of imagery.
[[headers]]
  for = "/products/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/sourced/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
